<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desiminatorët</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            background: #f8f9fa;
        }
        .container {
            display: flex;
            width: 100%;
        }
        .sidebar {
            width: 250px;
            background: #fcc14f;
            padding: 20px;
            color: black;
            height: 100vh;
        }
        .sidebar h2 {
            text-align: center;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            padding: 10px;
            cursor: pointer;
            background: #fcc14f;
            color: black;
            border-radius: 5px;
            margin-bottom: 5px;
            text-align: center;
        }
        .sidebar ul li:hover, .sidebar ul li.active {
            background: #008080;
            color: white;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
        .table-container {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #ffcc00;
            color: black;
        }
        .btn {
            padding: 5px 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-edit {
            background-color: #008080;
            color: white;
        }
        .btn-delete {
            background-color: #d9534f;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <img src="../Screenshot (4).PNG" width="50" height="50" alt="Logo">
            <h2>Super Admin</h2>
            <ul>
                <li>Paneli i kontrollit</li>
                <li>Mentorët</li>
                <li class="active">Desiminatorët</li>
                <li>Vullnetarët</li>
                <li>Regjistro Desiminator</li>
                <li>Regjistro Vullnetar</li>
                <li>Regjistro Mentor</li>
                <li>Projektet</li>
                <li>Raportet</li>
            </ul>
        </aside>
        <main class="content">
            <h1>Desiminatorët</h1>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Emri</th>
                            <th>Mbiemri</th>
                            <th>Email-i</th>
                            <th>Numri i telefonit</th>
                            <th>Funksioni</th>
                        </tr>
                      
                           
                        </tr>
                    
                    </thead>
                    <tbody id="desiminatoretTable">
                        <!-- Të dhënat do të shtohen këtu dinamike -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script>
        // Merrni të dhënat nga localStorage
        let desiminatoret = JSON.parse(localStorage.getItem("desiminatoret")) || [];
        const desiminatoretTable = document.getElementById("desiminatoretTable");

        // Funksioni për të rifreskuar tabelën
        function refreshTable() {
            desiminatoretTable.innerHTML = ""; // Pastro tabelën
            desiminatoret.forEach((desiminator, index) => {
                const row = desiminatoretTable.insertRow();
                row.innerHTML = `
                    <td>${desiminator.emri}</td>
                    <td>${desiminator.mbiemri}</td>
                    <td>${desiminator.email}</td>
                    <td>${desiminator.telefoni}</td>
                    <td>
                        <button class="btn btn-edit" onclick="editDesiminator(${index})">Edit</button>
                        <button class="btn btn-delete" onclick="deleteDesiminator(${index})">Fshi</button>
                    </td>
                `;
            });
        }

        // Funksioni për të redaktuar një desiminator
        function editDesiminator(index) {
            const desiminator = desiminatoret[index];
            const newEmri = prompt("Ndrysho Emrin:", desiminator.emri);
            const newMbiemri = prompt("Ndrysho Mbiemrin:", desiminator.mbiemri);
            const newEmail = prompt("Ndrysho Email-in:", desiminator.email);
            const newTelefoni = prompt("Ndrysho Numrin e Telefonit:", desiminator.telefoni);

            if (newEmri && newMbiemri && newEmail && newTelefoni) {
                desiminatoret[index] = {
                    emri: newEmri,
                    mbiemri: newMbiemri,
                    email: newEmail,
                    telefoni: newTelefoni
                };
                localStorage.setItem("desiminatoret", JSON.stringify(desiminatoret)); // Përditëso localStorage
                refreshTable(); // Rifresko tabelën
            }
        }

        // Funksioni për të fshirë një desiminator
        function deleteDesiminator(index) {
            if (confirm("A jeni i sigurt që dëshironi të fshini këtë desiminator?")) {
                desiminatoret.splice(index, 1); // Fshi desiminatorin nga lista
                localStorage.setItem("desiminatoret", JSON.stringify(desiminatoret)); // Përditëso localStorage
                refreshTable(); // Rifresko tabelën
            }
        }

        // Shto të dhënat në tabelë kur faqja ngarkohet
        refreshTable();
    </script>
</body>
</html>
