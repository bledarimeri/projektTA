<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oret Vullnetare</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
        }
        .sidebar {
            width: 200px;
            background: #FFD700;
            padding: 20px;
            height: 100vh;
        }
      
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin: 10px 0;
        }
        .sidebar ul li a {
            text-decoration: none;
            color: black;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }
        .sidebar ul li a.active, .sidebar ul li a:hover {
            background: #008000;
            color: white;
        }
        .content {
            flex: 1;
            padding: 20px;
            background: #f5f5f5;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group input[type="file"] {
            padding: 3px;
        }
        button {
            background: #008000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #006400;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <img src="../Screenshot (4).PNG" width="50" height="50" alt="Logo" class="logo">
        <ul>
            <li><a href="#">Cikli PVH</a></li>
            <li><a href="#">Rezultatet e Arritura</a></li>
            <li><a href="#" class="active">Orët Vullnetare</a></li>
            <li><a href="#">Kthehu</a></li>
        </ul>
    </div>
    <div class="content">
        <h2>Orët Vullnetare</h2>
        <div class="form-container">
            <div class="form-group">
                <label>Aktivitete Konkrete:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Data e fillimit:</label>
                <select>
                    <option>Select Date</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ora e fillimit:</label>
                <select>
                    <option>Zgjedh Oren</option>
                </select>
            </div>
            <div class="form-group">
                <label>Data e Perfundimit:</label>
                <select>
                    <option>Select Date</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ora e perfundimit:</label>
                <select>
                    <option>Zgjedh Oren</option>
                </select>
            </div>



            <div class="form-group">
                <label>Pjesemarres qe kryen aktivitetin:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Vlerësimi:</label>
                <input type="text">
            </div>
            <button>Dërgo</button>
            <button>Shkarko PDF</button>
        </div>
        <p class="bottom-text">Faturat e ngarkuara: Nuk keni ngarkuar foto.</p>
    </div>
</body>
</html>
