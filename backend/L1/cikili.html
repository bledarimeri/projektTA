<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cikli PVH</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: white;
        }
        .sidebar {
            width: 250px;
            background-color: #fcc14f;
            padding: 15px;
            height: 100vh;
            position: fixed;
            color: black;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin: 10px 0;
        }
        .sidebar ul li a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            display: block;
            padding: 10px;
            transition: 0.3s;
        }
        .sidebar ul li a:hover, .sidebar ul li a.active {
            background-color: #00796b;
            color: white;
            border-radius: 5px;
        }
        .content {
            margin-left: 270px;
            padding: 20px;
            width: calc(100% - 270px);
        }
        h2 {
            color: #333;
        }
        .form-container {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .radio-group {
            display: flex;
            gap: 15px;
        }
        .radio-group input {
            margin-right: 5px;
        }
        button {
            background-color: #00796b;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #00796b;
        }
        .file-input {
            background: white;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .bottom-text {
            margin-top: 15px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <img src="../Screenshot (4).PNG" width="50" height="50" alt="Logo" class="logo">
        <h4>Super Admin</h4>
        <ul>
            <li><a href="#" class="active">Cikli PVH</a></li>
            <li><a href="#">Rezultatet e Arritura</a></li>
            <li><a href="#">Orët Vullnetare</a></li>
            <li><a href="#">Kthehu</a></li>
        </ul>
    </div>
    <div class="content">
        <h2>Cikli PVH</h2>
        <div class="form-container">
            <div class="form-group">
                <label>Titulli:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Aksioni:</label>
                <div class="radio-group">
                    <label><input type="radio" name="aksioni"> Aksion në komunitet</label>
                    <label><input type="radio" name="aksioni"> Aksion ndër kulturor</label>
                    <label><input type="radio" name="aksioni"> Aksion kundër dhunës</label>
                </div>
            </div>
            <div class="form-group">
                <label>Drag e NYK:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Desiminatori:</label>
                <select>
                    <option>Select Teacher</option>
                </select>
            </div>
            <div class="form-group">
                <label>Puna:</label>
                <textarea></textarea>
            </div>
            <div class="form-group">
                <label>Përmbajtja:</label>
                <textarea></textarea>
            </div>
            <div class="form-group">
                <label>Analiza e Problemit:</label>
                <textarea></textarea>
            </div>
            <div class="form-group">
                <label>Notë:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Përcaktimi:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Përshkrimi i Projektit:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Informacione Shtesë:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Skedarët e ngarkuar (PDF, DOCX, Images):</label>
                <input type="file" class="file-input">
            </div>
            <div class="form-group">
                <label>Vërejtje:</label>
                <textarea></textarea>
            </div>
            <button type="submit">Dërgo</button>
            <button type="button">Shkarko PDF</button>
        </div>
        <div class="bottom-text">
            <p>Fushat e regjistruara: Nuk keni regjistruar foto.</p>
        </div>
    </div>
</body>
</html>
