<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regjistro Mentorët</title>
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .sidebar {
            width: 25%;
            background: #fbc02d;
            padding: 20px;
            height: auto;
            color: black;
        }
        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }
        .sidebar nav ul li {
            padding: 10px 0;
        }
        .sidebar nav ul li a {
            text-decoration: none;
            color: black;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }
        .sidebar nav ul li a.active, .sidebar nav ul li a:hover {
            background: #00897b;
            color: white;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 20px;
            padding-right: 50px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 50%;
            margin-top: 20px;
        }
        form input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #00897b;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #00796b;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <img src="../Screenshot (4).PNG" alt="Logo" width="50" height="50">
            <h2>Super Admin</h2>
        </div>
        <nav>
            <ul>
                <li><a href="#">Paneli i kontrollit</a></li>
                <li><a href="#">Mentorët</a></li>
                <li><a href="#">Desiminatorët</a></li>
                <li><a href="#">Vullnetarët</a></li>
                <li><a href="#" class="active">Regjistro Mentor</a></li>
                <li><a href="#">Regjistro Vullnetarë</a></li>
                <li><a href="#">Regjistro Desiminator</a></li>
                <li><a href="#">Projektet</a></li>
                <li><a href="#">Raportet</a></li>
            </ul>
        </nav>
    </aside>
    <main class="content">
        <h1>Regjistro Mentorë</h1>
        <div class="form-container">
            <h3>Informacionet e Mentorëve</h3>
            <form id="registerForm">
                <input type="text" id="emri" placeholder="Emri" required>
                <input type="text" id="mbiemri" placeholder="Mbiemri" required>
                <input type="email" id="email" placeholder="Email-i" required>
                <input type="text" id="telefoni" placeholder="Numri i telefonit" required>
                <input type="text" id="qyteti" placeholder="Qyteti" required>
                <input type="password" id="password" placeholder="Fjalëkalimi" required>
                <input type="password" id="confirmPassword" placeholder="Konfirmo fjalëkalimin" required>
                <button type="submit">Regjistro</button>
            </form>
        </div>
    </main>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            // Merrni të dhënat nga forma
            const emri = document.getElementById("emri").value;
            const mbiemri = document.getElementById("mbiemri").value;
            const email = document.getElementById("email").value;
            const telefoni = document.getElementById("telefoni").value;

            // Ruani të dhënat në localStorage për t'i përdorur në mentoret.html
            const mentor = { emri, mbiemri, email, telefoni };
            let mentoret = JSON.parse(localStorage.getItem("mentoret")) || [];
            mentoret.push(mentor);
            localStorage.setItem("mentoret", JSON.stringify(mentoret));

            // Shfaq mesazhin e suksesit dhe ridrejto te mentoret.html
            alert("Mentori u regjistrua me sukses!");
            window.location.href = "mentoret.html";
        });
    </script>
</body>
</html>
